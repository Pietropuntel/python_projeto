{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    .login-box {
      background: rgba(0, 0, 0, 0.65);
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      color: white;
      width: 300px;
    }

    .login-box input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: none;
    }

    .login-box button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-entrar {
      background-color: #7ed957;
      color: #000000;
    }

    .btn-entrar:hover {
      background-color: rgb(72, 255, 0);
    }

    .btn-cadastrar {
      background-color: rgb(72, 255, 0);
      color: black;
    }

    .btn-cadastrar:hover {
      background-color: #dddddd;
    }

    .separador {
      margin: 10px 0;
      color: #ccc;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <video autoplay muted loop id="bg-video">
    <source src="{% static 'core/imgs/video.mp4' %}" type="video/mp4">
  </video>

  <div class="login-box">
    <h2>Login</h2>

    <form method="POST">
      {% csrf_token %}

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required>

      <button type="submit" class="btn-entrar">Entrar</button>
    </form>

    <div class="separador">ou</div>

    <!-- BOTÃO CADASTRAR -->
    <a href="{% url 'cadastro' %}">
      <button type="button" class="btn-cadastrar">
        Cadastrar
      </button>
    </a>

  </div>

</body>
</html>
