{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    
    .login-box {
      background: rgba(0, 0, 0, 0.65);
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      color: white;
      width: 300px;
    }

    .login-box input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: none;
    }

    .login-box button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      background-color: #7ed957;
      color: #000000;
      font-size: 16px;
      cursor: pointer;
    }

    .login-box button:hover {
      background-color: rgb(72, 255, 0);
    }
  </style>
</head>

<body>

  
  <video autoplay muted loop id="bg-video">
    <source src="{% static 'core/imgs/video.mp4' %}" type="video/mp4">
  </video>

  <div class="login-box">
    <h2>Login</h2>

    <label for="email">Email</label>
    <input type="email" id="email" name="email">

    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha">

    <button type="submit">Entrar</button>
  </div>

</body>
</html>
