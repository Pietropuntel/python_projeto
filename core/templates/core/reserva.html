{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Reserva</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #0f8c9d, #0a6d79);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Container principal */
.main-box {
    width: 95%;
    max-width: 900px;
    background: #ffffff;
    padding: 50px;
    border-radius: 30px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.25);
}

/* Área verde */
.green-area {
    background: linear-gradient(135deg, #7ed957, #63c13f);
    padding: 50px;
    border-radius: 35px;
    position: relative;
}

/* Título */
.title {
    background: white;
    padding: 15px 40px;
    border-radius: 40px;
    font-size: 26px;
    font-weight: 700;
    text-align: center;
    margin: 0 auto 50px auto;
    width: fit-content;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

/* Card formulário */
.card {
    background: white;
    width: 70%;
    margin: auto;
    padding: 40px;
    border-radius: 30px;
    box-shadow: 0 20px 45px rgba(0,0,0,0.18);
}

/* Labels */
label {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    display: block;
}

/* Inputs */
input {
    width: 100%;
    padding: 14px;
    border-radius: 15px;
    border: 1px solid #ddd;
    background: #f8f8f8;
    font-size: 14px;
    transition: all 0.3s ease;
}

input:focus {
    outline: none;
    border-color: #63c13f;
    box-shadow: 0 0 12px rgba(99,193,63,0.4);
    background: #ffffff;
}

/* Espaçamentos */
.local-box {
    margin-bottom: 25px;
}

.row {
    display: flex;
    gap: 20px;
    margin-top: 20px;
}

.field {
    flex: 1;
}

/* Botões */
.buttons {
    margin-top: 40px;
    text-align: center;
}

button {
    padding: 12px 30px;
    border-radius: 30px;
    border: none;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
}

.cancel-btn {
    background: #f27d7d;
    color: white;
    margin-right: 15px;
}

.cancel-btn:hover {
    background: #e35c5c;
    transform: translateY(-2px);
}

.save-btn {
    background: #63c13f;
    color: white;
}

.save-btn:hover {
    background: #4daf2d;
    transform: translateY(-2px);
}

/* Mensagem sucesso */
.success-message {
    display: none;
    margin-top: 25px;
    padding: 15px;
    background: #e6f7e6;
    color: #2e7d32;
    border-radius: 15px;
    text-align: center;
    font-weight: 600;
    animation: fadeIn 0.4s ease-in-out;
}

/* Animação */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}

</style>
</head>

<body>

<div class="main-box">
    <div class="green-area">

        <div class="title">Reserva</div>

        <div class="card">

            <form id="reservaForm">

                <div class="local-box">
                    <label>Local</label>
                    <input type="text" name="local" placeholder="Digite o local" required>
                </div>

                <div class="row">
                    <div class="field">
                        <label>Data</label>
                        <input type="date" name="data" required>
                    </div>

                    <div class="field">
                        <label>Hora</label>
                        <input type="time" name="hora" required>
                    </div>
                </div>

                <div class="buttons">
                    <button type="button" class="cancel-btn"
                        onclick=window.location.href='{% url "principal" %}'>
                        Cancelar
                    </button>

                    <button type="submit" class="save-btn">
                        Salvar
                    </button>
                </div>

                <div class="success-message" id="successMessage">
                    Reserva salva com sucesso!
                </div>

            </form>

        </div>

    </div>
</div>

<script>
document.getElementById("reservaForm").addEventListener("submit", function(event){
    event.preventDefault();

    if(this.checkValidity()){
        document.getElementById("successMessage").style.display = "block";
        this.reset();
    }
});
</script>

</body>
</html>
