{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Reserva</title>

<style>
:root{
  --primary:#1e293b;
  --accent:#22c55e;
  --danger:#ef4444;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:'Segoe UI', Tahoma, sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  width:95%;
  max-width:700px;
  background:white;
  padding:50px;
  border-radius:30px;
  box-shadow:0 25px 60px rgba(0,0,0,0.3);
  animation:fadeUp .6s ease;
}

.title{
  font-size:28px;
  font-weight:700;
  text-align:center;
  margin-bottom:40px;
  color:var(--primary);
}

.field{ margin-bottom:25px; }

label{
  font-size:14px;
  font-weight:600;
  display:block;
  margin-bottom:8px;
  color:#334155;
}

input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid #e2e8f0;
  background:#f8fafc;
  font-size:14px;
  transition:.3s;
}

input:focus{
  outline:none;
  border-color:var(--accent);
  background:white;
  box-shadow:0 0 0 3px rgba(34,197,94,0.2);
}

.row{
  display:flex;
  gap:20px;
}

.row .field{ flex:1; }

.buttons{
  margin-top:40px;
  display:flex;
  justify-content:center;
  gap:20px;
}

button{
  padding:12px 35px;
  border-radius:30px;
  border:none;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
}

.cancel-btn{
  background:var(--danger);
  color:white;
}

.cancel-btn:hover{
  background:#dc2626;
  transform:translateY(-2px);
}

.save-btn{
  background:var(--accent);
  color:white;
}

.save-btn:hover{
  background:#16a34a;
  transform:translateY(-2px);
}

/* MODAL */
.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
  animation:fadeIn .3s ease;
}

.modal-box{
  background:white;
  padding:30px;
  border-radius:20px;
  width:90%;
  max-width:400px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,0.3);
}

.modal-buttons{
  margin-top:20px;
  display:flex;
  justify-content:center;
  gap:15px;
}

.modal button{
  padding:10px 25px;
  border-radius:25px;
}

.confirm-btn{
  background:var(--danger);
  color:white;
}

.close-btn{
  background:#e2e8f0;
}

@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(30px);}
  to{opacity:1;transform:translateY(0);}
}

@media(max-width:600px){
  .row{ flex-direction:column; }
}
</style>
</head>

<body>

<div class="container">

  <div class="title">Nova Reserva</div>

  <!-- FORMULÁRIO FUNCIONAL -->
  <form method="POST" action="{% url 'principal' %}">
    {% csrf_token %}

    <div class="field">
      <label>Local</label>
      <input type="text" name="local" placeholder="Digite o local da reserva" required>
    </div>

    <div class="row">
      <div class="field">
        <label>Data</label>
        <input type="date" name="data" required>
      </div>

      <div class="field">
        <label>Hora</label>
        <input type="time" name="horario" required>
      </div>
    </div>

    <div class="buttons">
      <button type="button" class="cancel-btn" onclick="abrirModal()">
        Cancelar
      </button>

      <button type="submit" class="save-btn">
        Salvar Reserva
      </button>
    </div>

  </form>

</div>

<!-- MODAL -->
<div class="modal" id="confirmModal">
  <div class="modal-box">
    <h3>Cancelar reserva?</h3>
    <p>Você perderá as informações preenchidas.</p>

    <div class="modal-buttons">
      <button class="close-btn" onclick="fecharModal()">Voltar</button>
      <button class="confirm-btn" onclick="irParaHome()">Sim, Cancelar</button>
    </div>
  </div>
</div>

<script>
function abrirModal(){
  document.getElementById("confirmModal").style.display = "flex";
}

function fecharModal(){
  document.getElementById("confirmModal").style.display = "none";
}

function irParaHome(){
  window.location.href = "{% url 'principal' %}";
}
</script>

</body>
</html>
