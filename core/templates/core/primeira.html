
{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recars</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
            color: white;
        }

        /* 🎥 Video fundo */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        /* 🌑 Camada escura por cima do vídeo */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: -1;
        }

        /* 📦 Conteúdo central */
        .container {
            text-align: center;
        }

        .container h1 {
            font-size: 50px;
            margin-bottom: 20px;
        }

        .container p {
            font-size: 18px;
            margin-bottom: 40px;
        }

        /* 🔘 Botão */
        .btn {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            background: #7ed957;
            color: black;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            font-weight: bold;
        }

        .btn:hover {
            background: #48ff00;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <!-- 🎥 Video -->
    <video autoplay muted loop id="bg-video">
        <source src="{% static 'core/imgs/video3.mp4' %}" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <!-- 📦 Conteúdo -->
    <div class="container">
        <h1>Recars</h1>
        <p>Encontre os melhores pontos de recarga para seu carro elétrico</p>

        <!-- 🔗 Botão para outra tela -->
        <a href="{% url 'inicial' %}" class="btn">Entrar</a>
    </div>

</body>
</html>
