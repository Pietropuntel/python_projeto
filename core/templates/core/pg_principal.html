{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Recar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background-color: #0f8c9d;
}

/* ESTRUTURA PRINCIPAL */
.main-container {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* NAVBAR */
.navbar {
    background: white;
    padding: 15px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.logo {
    font-size: 26px;
    font-weight: bold;
    color: #0f8c9d;
}

.nav-links a {
    text-decoration: none;
    margin-left: 25px;
    color: #333;
    font-weight: 500;
}

/* HERO */
.hero {
    text-align: center;
    padding: 20px;
    color: white;
}

.hero h1 {
    margin: 10px 0;
}

.actions {
    margin-top: 15px;
}

.action-btn {
    background: white;
    color: #0f8c9d;
    padding: 10px 25px;
    margin: 5px;
    border-radius: 30px;
    text-decoration: none;
    font-weight: bold;
}

/* MAPA ocupa o resto da tela */
.map-section {
    flex: 1;
    background: #7ed957;
    margin: 20px;
    border-radius: 25px;
    padding: 20px;
    display: flex;
    flex-direction: column;
}

.map-title {
    background: white;
    padding: 6px 20px;
    border-radius: 20px;
    font-weight: bold;
    align-self: flex-start;
    margin-bottom: 10px;
}

#map {
    flex: 1;
    border-radius: 15px;
}

</style>
</head>

<body>

<div class="main-container">

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="logo">Recar</div>
        <div class="nav-links">
            <a href="{% url 'minha_reserva' %}">Minhas Reservas </a>
        </div>
    </div>

    <!-- HERO -->
    <div class="hero">
        <h1>Encontre Pontos de Recarga</h1>
        <div class="actions">
            <a href="{% url 'reserva' %}" class="action-btn">Fazer Reserva</a>
            <a href="{% url 'disponibilidade' %}" class="action-btn">Ver Disponibilidade</a>
        </div>
    </div>

    <!-- MAPA -->
    <div class="map-section">
        <div class="map-title">Mapa de Recarga</div>
        <div id="map"></div>
    </div>

</div>

<script>
function initMap() {
    const portoAlegre = { lat: -30.0346, lng: -51.2177 };

    const map = new google.maps.Map(document.getElementById("map"), {
        zoom: 13,
        center: portoAlegre,
    });

    new google.maps.Marker({
        position: portoAlegre,
        map: map,
        title: "Ponto de Recarga"
    });
}
</script>

<script async
src="https://maps.googleapis.com/maps/api/js?key=SUA_API_KEY_AQUI&callback=initMap">
</script>

</body>
</html>
