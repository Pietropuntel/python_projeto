{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Recar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
:root{
    --primary:#0f8c9d;
    --dark:#0b5f6b;
    --light:#f8fafc;
    --white:#ffffff;
    --shadow:0 20px 40px rgba(0,0,0,0.08);
}

*{ box-sizing:border-box; }

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden; /* 🔥 REMOVE A BARRA DE ROLAGEM */
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg,#0f8c9d,#0b5f6b);
}

.main-container {
    height: 100vh; /* 🔥 ocupa exatamente a tela */
    display: flex;
    flex-direction: column;
}

/* NAVBAR */
.navbar {
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    padding: 18px 60px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: var(--shadow);
}

.logo {
    font-size: 26px;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: 1px;
}

.nav-links a {
    text-decoration: none;
    margin-left: 30px;
    color: #334155;
    font-weight: 600;
    transition: .3s;
}

.nav-links a:hover {
    color: var(--primary);
}

/* HERO */
.hero {
    text-align: center;
    padding: 30px 20px 10px;
    color: white;
}

.hero h1{
    font-size: 32px;
    margin-bottom: 5px;
}

.hero p{
    font-size: 14px;
    opacity: 0.9;
}

/* BOTÕES */
.actions {
    margin-top: 20px;
}

.action-btn {
    background: white;
    color: var(--primary);
    padding: 12px 28px;
    margin: 6px;
    border-radius: 40px;
    text-decoration: none;
    font-weight: 600;
    display: inline-block;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    transition: all 0.3s ease;
}

.action-btn:hover {
    background: var(--primary);
    color: white;
    transform: translateY(-4px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.3);
}

/* MAP CARD */
.map-container {
    background: var(--white);
    margin: 20px auto;
    padding: 20px;
    border-radius: 30px;
    width: 90%;
    max-width: 1200px;
    box-shadow: var(--shadow);
    flex: 1; /* 🔥 ocupa o espaço restante */
    display: flex;
    flex-direction: column;
}

.map-title {
    text-align: center;
    margin-bottom: 15px;
    font-size: 18px;
    color: #1e293b;
}

#map {
    flex: 1; /* 🔥 mapa se adapta */
    width: 100%;
    border-radius: 25px;
    border: 4px solid var(--primary);
}
</style>
</head>

<body>

<div class="main-container">

    <div class="navbar">
        <div class="logo">⚡ Recar</div>
        <div class="nav-links">
            <a href="{% url 'minha_reserva' %}">Minhas Reservas</a>
        </div>
    </div>

    <div class="hero">
        <h1>Encontre Pontos de Recarga</h1>
        <p>Localize, reserve e recarregue seu veículo elétrico com facilidade.</p>

        <div class="actions">
            <a href="{% url 'reserva' %}" class="action-btn">Fazer Reserva</a>
            <a href="{% url 'disponibilidade' %}" class="action-btn">Ver Disponibilidade</a>
        </div>
    </div>

    <div class="map-container">
        <h2 class="map-title">Mapa de Pontos de Recarga</h2>
        <div id="map"></div>
    </div>

</div>

<script>
var locais = [
    { nome: "Country", lat: -29.7086, lng: -52.3989 },
    { nome: "Afubra", lat: -29.716762, lng: -52.4381019 },
    { nome: "Ana Nery", lat: -29.7377030, lng: -52.4275250 },
    { nome: "Drogaria scs", lat: -29.7189196, lng: -52.4291451},
    { nome: "Hotel scs", lat: -29.7187701, lng: -52.4290317 },
    { nome: "Hotel charr", lat: -29.7133042, lng: -52.4275987},
    { nome: "Shopping scs", lat: -29.7052081, lng: -52.4295978 },
    { nome: "Zé pneus", lat: -29.7183036, lng: -52.4453116 },
    { nome: "Gm cristais", lat: -29.6885243, lng: -52.4193519 },
    { nome: "Lisa Ruth", lat: -29.6912246, lng: -52.4010206 },
    { nome: "Solled Energia", lat: -29.6912904, lng: -52.3956234 },
    { nome: "Eletroposto", lat: -29.691261, lng: -52.3957817 },
    { nome: "Unisc", lat: -29.699022, lng: -52.4387877 },
    { nome: "Mercado Saudável", lat: -29.7052255, lng: -52.4275137 },
];

var map = L.map('map').setView([locais[0].lat, locais[0].lng], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

locais.forEach(function(local) {
    L.marker([local.lat, local.lng])
        .addTo(map)
        .bindPopup("<b>"+local.nome+"</b>");
});
</script>

</body>
</html>
