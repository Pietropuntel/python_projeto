{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* 🎥 Vídeo de fundo */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    /* 📦 Caixa do formulário */
    .cadastro-box {
      background: rgba(0, 0, 0, 0.70);
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      color: white;
      width: 350px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .cadastro-box input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: none;
    }

    .cadastro-box button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      border: none;
      border-radius: 6px;
      background-color: #7ed957;
      color: #000000;
      font-size: 16px;
      cursor: pointer;
    }

    .cadastro-box button:hover {
      background-color: rgb(72, 255, 0);
    }

    label {
      font-size: 14px;
      display: block;
      text-align: left;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <!-- 🎥 Video Fundo -->
  <video autoplay muted loop id="bg-video">
    <source src="{% static 'core/imgs/video.mp4' %}" type="video/mp4">
  </video>

  <!-- 📦 Formulário Cadastro -->
  <div class="cadastro-box">
    <h2>Cadastro</h2>

    <form method="POST">
      {% csrf_token %}

      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" required>

      <label for="cpf">CPF</label>
      <input type="text" id="cpf" name="cpf" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="telefone">Telefone</label>
      <input type="text" id="telefone" name="telefone" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required>

      <label for="confirmar_senha">Confirmar Senha</label>
      <input type="password" id="confirmar_senha" name="confirmar_senha" required>

      <button type="submit">Cadastrar</button>
    </form>
  </div>

</body>
</html>
