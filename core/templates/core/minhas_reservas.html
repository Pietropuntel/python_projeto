<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minhas Reservas</title>

<style>
:root{
    --primary:#166534;
    --accent:#22c55e;
    --bg:#f1f5f9;
    --card:#ffffff;
    --text:#1e293b;
    --muted:#64748b;
    --shadow:0 15px 40px rgba(0,0,0,0.08);
}

*{ box-sizing:border-box; }

body{
    margin:0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
}

/* HEADER */
.header{
    background:var(--card);
    padding:20px 60px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 4px 15px rgba(0,0,0,0.05);
}

.header h1{
    margin:0;
    font-size:24px;
    font-weight:600;
    color:var(--primary);
}

.btn-voltar{
    background:var(--accent);
    color:white;
    padding:10px 20px;
    border-radius:30px;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    transition:.3s;
    box-shadow:0 6px 15px rgba(34,197,94,0.3);
}

.btn-voltar:hover{
    background:#16a34a;
    transform:translateY(-2px);
}

/* CONTAINER */
.container{
    max-width:1000px;
    margin:40px auto;
    padding:0 20px;
}

/* CARD */
.reserva-card{
    background:var(--card);
    padding:25px;
    border-radius:20px;
    margin-bottom:25px;
    box-shadow:var(--shadow);
    transition:.3s;
    border-left:6px solid var(--accent);
}

.reserva-card:hover{
    transform:translateY(-5px);
}

.reserva-header{
    font-weight:600;
    font-size:18px;
    margin-bottom:15px;
    color:var(--primary);
}

.reserva-info{
    display:flex;
    gap:40px;
    flex-wrap:wrap;
    font-size:14px;
    color:var(--muted);
}

.reserva-info span{
    display:flex;
    align-items:center;
    gap:6px;
}

/* EMPTY STATE */
.empty{
    text-align:center;
    padding:60px 20px;
    background:var(--card);
    border-radius:20px;
    box-shadow:var(--shadow);
    color:var(--muted);
}

/* FOOTER */
.footer{
    text-align:center;
    margin-top:50px;
    color:var(--muted);
    font-size:13px;
}
</style>
</head>

<body>

<div class="header">
    <h1>📅 Minhas Reservas</h1>
    <a href="{% url 'principal' %}" class="btn-voltar">🏠 Voltar</a>
</div>

<div class="container">

    <div id="listaReservas"></div>

    <div class="footer">
        Sistema de Reservas • 2026
    </div>

</div>

<script>
const reservas = [
    { local: "Estacionamento Central", data: "10/03/2026", horario: "14:00" },
    { local: "Shopping Verde", data: "12/03/2026", horario: "09:30" }
];

const lista = document.getElementById("listaReservas");

if (reservas.length > 0) {
    reservas.forEach(reserva => {
        lista.innerHTML += `
            <div class="reserva-card">
                <div class="reserva-header">${reserva.local}</div>
                <div class="reserva-info">
                    <span>📆 <strong>Data:</strong> ${reserva.data}</span>
                    <span>⏰ <strong>Horário:</strong> ${reserva.horario}</span>
                </div>
            </div>
        `;
    });
} else {
    lista.innerHTML = `
        <div class="empty">
            <h2>Você ainda não possui reservas</h2>
            <p>Quando fizer uma reserva, ela aparecerá aqui.</p>
        </div>
    `;
}
</script>

</body>
</html>
